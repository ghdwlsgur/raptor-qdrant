name: raptor-qdrant

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/6333 && echo ok >&3"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # 값 없이 이름만 적으면 호스트에 있을 때만 넘어간다. 빈 문자열을 넣으면
      # SDK 가 그것을 키로 알고 401 을 받는다
      - ANTHROPIC_API_KEY
      - ANTHROPIC_MODEL
      - OPENAI_API_KEY
      - OPENAI_MODEL
      - SUMMARY_MODEL
    volumes:
      - model-cache:/models
      - ./data:/app/data:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  qdrant-storage:
  model-cache:
