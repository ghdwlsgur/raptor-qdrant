[project]
name = "raptor-qdrant"
version = "0.1.0"
description = "RAPTOR hierarchical-tree RAG for Korean documents — KURE-v1 embeddings, Qdrant hybrid search, pluggable LLM (Ollama / Bedrock)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "loguru>=0.7.3",
    "pydantic-settings>=2.10.1",
    "qdrant-client>=1.15.1",
    "sentence-transformers>=5.1.0",
    "tenacity>=9.1.2",
    "tiktoken>=0.11.0",
    "umap-learn>=0.5.0",
    "scikit-learn>=1.0.0",
    "numpy>=1.21.0",
    "tqdm>=4.64.0",
    "numba>=0.56.0",
    "boto3>=1.40.30",
    "llama-index>=0.14.1",
    "llama-index-vector-stores-qdrant>=0.8.4",
    "llama-index-embeddings-huggingface>=0.6.1",
    "python-dotenv>=1.1.1",
    "torch>=2.8.0",
    "fastembed>=0.7.3",
]
