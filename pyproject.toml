[project]
name = "raptor-qdrant"
version = "0.1.0"
description = "RAPTOR hierarchical-tree RAG for Korean documents: KURE-v1 embeddings, Qdrant hybrid search, pluggable LLM (Ollama / Bedrock)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "HongJinHyeok" }]
keywords = ["rag", "raptor", "qdrant", "korean-nlp", "hybrid-search"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "loguru>=0.7.3",
    "pydantic-settings>=2.10.1",
    "qdrant-client>=1.15.1",
    "sentence-transformers>=5.1.0",
    "tenacity>=9.1.2",
    "tiktoken>=0.11.0",
    "umap-learn>=0.5.0",
    "scikit-learn>=1.0.0",
    "numpy>=1.21.0",
    "tqdm>=4.64.0",
    "numba>=0.56.0",
    "boto3>=1.40.30",
    "llama-index>=0.14.1",
    "llama-index-vector-stores-qdrant>=0.8.4",
    "llama-index-embeddings-huggingface>=0.6.1",
    "python-dotenv>=1.1.1",
    "torch>=2.8.0",
    "fastembed>=0.7.3",
    "watchdog>=6.0.0",
    "anthropic>=1.7.0",
    "openai>=1.107.0",
]

[project.scripts]
raptor-qdrant = "raptor_qdrant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raptor_qdrant"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.14.0",
    "mypy>=1.18.0",
    "types-tqdm>=4.66",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 79
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["raptor_qdrant"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
